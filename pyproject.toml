[project]
name = "studentwellfare-backend"
version = "0.1.0"
description = "FastAPI backend for the student safety mobile app MVP"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "httpx>=0.28.0",
  "sqlalchemy>=2.0.36",
  "uvicorn[standard]>=0.32.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/studentwellfare_api"]

[tool.uv]
package = true
